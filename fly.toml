app = "argus-cloud-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "alembic upgrade head"

[env]
  ARGUS_ENV = "production"
  AUTO_CREATE_TABLES = "0"
  REDIS_REQUIRED = "1"
  # release_command already migrates once per deploy.
  RUN_MIGRATIONS_ON_START = "0"
  # Fly's proxy sets this header itself; clients cannot forge it.
  CLIENT_IP_HEADER = "Fly-Client-IP"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

  [http_service.concurrency]
    type = "connections"
    soft_limit = 75
    hard_limit = 100

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
