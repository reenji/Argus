name: Build desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-14
          - platform: windows-x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"

      - name: Install app and packager dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.12,<7"

      - name: Build desktop app
        run: python -m PyInstaller --noconfirm --clean ARGUS.spec

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\argus.iss

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: hdiutil create -volname ARGUS -srcfolder dist/ARGUS.app -ov -format UDZO "dist/ARGUS-${GITHUB_REF_NAME}-macos-arm64.dmg"

      - name: Build Linux Debian installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package_root="$RUNNER_TEMP/argus-deb"
          rm -rf "$package_root"
          install -d "$package_root/DEBIAN" "$package_root/usr/lib/argus" "$package_root/usr/bin" "$package_root/usr/share/applications"
          cp -a dist/ARGUS/. "$package_root/usr/lib/argus/"
          ln -s ../lib/argus/ARGUS "$package_root/usr/bin/argus"
          cat > "$package_root/DEBIAN/control" <<EOF
          Package: argus-desktop
          Version: ${GITHUB_REF_NAME#v}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libc6, libgcc-s1, libstdc++6, libgl1, libglib2.0-0, libportaudio2
          Maintainer: Argus contributors
          Description: Argus desktop assistant
           Local desktop assistant with voice and text interaction.
          EOF
          cat > "$package_root/usr/share/applications/argus.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Argus
          Exec=/usr/bin/argus
          Terminal=false
          Categories=Utility;
          EOF
          dpkg-deb --build --root-owner-group "$package_root" "dist/ARGUS-${GITHUB_REF_NAME}-linux-x86_64.deb"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: argus-${{ matrix.platform }}
          path: dist/ARGUS-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-24.04
    # Only this job writes; packaging installs unpinned dependencies.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: argus-*
          merge-multiple: true

      - name: Create SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release and installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --repo "${GITHUB_REPOSITORY}" --title "Argus ${GITHUB_REF_NAME}" --generate-notes
