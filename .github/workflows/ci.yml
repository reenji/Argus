name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: argus_test
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U argus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://argus:argus@localhost:5432/argus_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-jwt-secret-with-sufficient-length
      ARGUS_ENCRYPTION_KEY: ci-encryption-secret-with-sufficient-length
      ARGUS_ENV: test
      AUTO_CREATE_TABLES: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      # Desktop modules load PortAudio (sounddevice), need an X display
      # (pyautogui) and Qt's EGL/xkb runtime (PyQt6) just to import.
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          xvfb libportaudio2 libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - run: >-
          xvfb-run -a python -m unittest -v
          tests.test_phase1_decoupling tests.test_hosted_api tests.test_core_resilience
          tests.test_qa_system tests.test_api_key_validation tests.test_action_helpers
          tests.test_cloud_tools tests.test_live_engine

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
