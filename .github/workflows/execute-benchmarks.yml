name: Execute Argus benchmarks

on:
  push:
    branches:
      - run-all-benchmarks-20261020
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: argus-benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-native:
    name: Web benchmark — native API + SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native API runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglib2.0-0 libportaudio2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run native API benchmark
        run: python scripts/benchmark_web.py --concurrency 1,5,10,20,40 --duration-seconds 20
      - name: Upload native benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-web-native
          path: docs/benchmarks/web-0.1.0-native-api-sqlite-*
          if-no-files-found: warn
          retention-days: 30

  web-compose:
    name: Web benchmark — Docker Compose + PostgreSQL + Redis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark collector
        run: python -m pip install psutil
      - name: Run Compose benchmark
        run: python scripts/benchmark_web.py --compose --concurrency 1,5,10,20,40 --duration-seconds 20
      - name: Upload Compose benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-web-compose
          path: docs/benchmarks/web-0.1.0-docker-compose-postgres-redis-*
          if-no-files-found: warn
          retention-days: 30

  desktop:
    name: Desktop benchmark — idle and interactive scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libglib2.0-0 libxcb-cursor0 libportaudio2 portaudio19-dev build-essential
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Build desktop application
        run: python -m PyInstaller --noconfirm --clean ARGUS.spec
      - name: Run desktop benchmark scenarios in a virtual display
        run: xvfb-run -a env QT_QPA_PLATFORM=offscreen python scripts/benchmark_desktop.py --scenario all --output-dir docs/benchmarks
      - name: Upload desktop benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-desktop
          path: docs/benchmarks/desktop-0.1.0-*
          if-no-files-found: warn
          retention-days: 30
