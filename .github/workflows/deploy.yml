name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    # Production only ships main; the environment holds the deploy secrets
    # and is where required reviewers can be configured.
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  frontend:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      # The CLI reads VERCEL_TOKEN from the environment; passing --token would
      # put it on the process command line.
      - run: npx --yes vercel@63.1.2 pull --yes --environment=production
      - run: npx --yes vercel@63.1.2 build --prod
      - run: npx --yes vercel@63.1.2 deploy --prebuilt --prod
