services:
  - type: web
    name: argus-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ARGUS_ENV
        value: production
      - key: AUTO_CREATE_TABLES
        value: "0"
      - key: REDIS_REQUIRED
        value: "1"
      # preDeployCommand already migrates once per deploy.
      - key: RUN_MIGRATIONS_ON_START
        value: "0"
      # Render's proxy appends the client address as the last X-Forwarded-For hop.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: argus-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: argus-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ARGUS_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
  - type: keyvalue
    name: argus-redis
    ipAllowList: []
    plan: starter

databases:
  - name: argus-postgres
    plan: basic-256mb
    databaseName: argus
    user: argus
