services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus-local
    volumes:
      - argus_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1
    volumes:
      - argus_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports: ["${ARGUS_API_HOST_PORT:-8000}:8000"]
    environment:
      ARGUS_ENV: development
      DATABASE_URL: postgresql://argus:argus-local@postgres:5432/argus
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-compose-jwt-secret-change-before-deploy
      ARGUS_ENCRYPTION_KEY: local-compose-encryption-secret-change-before-deploy
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      AUTO_CREATE_TABLES: "0"
      ARGUS_DATA_RETENTION_DAYS: ${ARGUS_DATA_RETENTION_DAYS:-90}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:${ARGUS_API_HOST_PORT:-8000}"
    volumes:
      - ./web:/app
      - argus_node_modules:/app/node_modules
    depends_on: [api]

volumes:
  argus_postgres:
  argus_redis:
  argus_node_modules:
